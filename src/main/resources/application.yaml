spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
         # Booking Service V1 Routes (40% traffic)
       - id: booking-service-v1
         uri: http://booking-service-v1:9091
         predicates:
           - Path=/api/v1/bookings/**
           - Weight=booking-group, 40
         # Booking Service V2 Routes (60% traffic)
       - id: booking-service-v2
         uri: http://booking-service-v2:9092
         predicates:
           - Path=/api/v2/bookings/**
           - Weight=booking-group, 60
         # User Service Routes
       - id: user-service
         uri: http://user-service:9092
         predicates:
           - Path=/api/v1/users/**
         filters:
              - name: RequestRateLimiter # Enables rate limiting filter
                args:
                  redis-rate-limiter.replenishRate: 10  # Number of tokens added to the user’s bucket per second.
                  redis-rate-limiter.burstCapacity: 20  # Maximum number of tokens the bucket can hold (allows short bursts)
                  key-resolver: "#{@ipKeyResolver}"
              - name: CircuitBreaker
                args:
                  name: userCircuitBreaker
                  fallbackUri: forward:/fallback/user
         # Notification Service Routes
       - id: notification-service
         uri: http://notification-service:9093
         predicates:
           - Path=/api/v1/notifications/**
         filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 500   # tokens added per second
                redis-rate-limiter.burstCapacity: 750   # max tokens (allows bursts)
                key-resolver: "#{@globalKeyResolver}"
         # Payment Service Routes
       - id: payment-service
         uri: http://payment-service:9094
         predicates:
           - Path=/api/v1/payments/**, /api/v1/refunds/**
         filters:
           - name: CircuitBreaker
             args:
               name: paymentCircuitBreaker
               fallbackUri: forward:/fallback/payment

    default-filters:
      - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

    globalcors:
      corsConfigurations:
        '[/**]':
          allowedOrigins: "*"
          allowedMethods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          allowedHeaders: "*"

server:
  port: 9020

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Without Redis, each gateway instance would have its own in-memory bucket → users could exceed limits by hitting multiple instances
# Redis provides centralized, distributed rate limiting
# Yes, Redis stores the token bucket per key / Tracks tokens and last refill time / Enables distributed, global, or per-user rate limiting
redis:
  host: localhost
  port: 6379

resilience4j:
  circuitbreaker:
    instances:
      paymentCircuitBreaker:    # ← ONE for each service route
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3

      orderCircuitBreaker:      # ← ONE for each service route
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3

  timelimiter:
    instances:
      paymentCircuitBreaker:
        timeoutDuration: 5s  # Maximum allowed time for the entire payment service call (connect + processing + response).
                             # If exceeded, fallback is triggered. Protects gateway threads from slow services.
      orderCircuitBreaker:
        timeoutDuration: 5s

# NO RETRY NEEDED!
  # Gateway retries = 3x load on backend (if backend is already struggling)
  # User waits longer (3 attempts × 2s = 6 seconds)
  # Better to fail fast and use circuit breaker
  # Retry should be in the backend service, not Gateway
