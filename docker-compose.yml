version: '3.9'

services:
  api-gateway:
    build:
      context: .                          # Build from current directory
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "9020:9020"                       #  Match your app port
    environment:
      - SPRING_PROFILES_ACTIVE=dev        #  Set profile
    networks:
      - api-gateway-network
    restart: on-failure
    healthcheck:                          # Optional health check
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  api-gateway-network:
    driver: bridge